name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Avoids the anonymous rate limit when fetching GitHub activity.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: E2E, accessibility, visual regression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Visual baselines are rendered in this image (scripts/visual.sh). Keep the
    # tag in sync with @playwright/test — the first step fails if it drifts.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.61.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Playwright image matches the installed version
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          test "$installed" = "$PLAYWRIGHT_IMAGE_VERSION" || {
            echo "::error::@playwright/test is $installed but the CI image is $PLAYWRIGHT_IMAGE_VERSION"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm test:e2e
        env:
          PW_VISUAL: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
